<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр M04 — сломанный скрипт</title>
  <link rel="stylesheet" href="styles.css">
  <script src="games.js" defer></script>
  <script src="app.js" defer></script>


  <!--
    Ошибки: 
    1. Ошибка в строке 38 app.js: название класса элемента в HTML (.catalog) не совпадает с селектором в JavaScript (.catalog-list), поэтому querySelector не находит элемент, в который должны вставляться карточки.
    2. Ошибка найдена через консоль JS: JavaScript загрузился и выполнился раньше, чем HTML был разобран. Поэтому querySelector не нашёл нужный элемент и присвоил переменной значение null. При попытке изменить innerHTML у null возникла ошибка Uncaught TypeError: Cannot set properties of null (setting 'innerHTML') в app.js:39:21.
    3. Ошибка в строках 24–25: опечатка в обращении к свойству game.nmae вместо game.name, из-за чего в alt и h2 передаётся undefined.
    4. ошибка в строке 13 вместо split("-") был использован slice() с числовыми аргументами. Из-за этого строка не разделялась по -. Также был пропущен return, поэтому функция не возвращала результат для передачи в следующую функцию.
  -->
  <!--
    Задание: страница должна показать каталог из шести игр — обложка,
    название, год, жанр и бейдж рейтинга в каждой карточке. Сейчас
    каталога на странице нет.

    Причин ровно четыре, и они независимы: починка одной не чинит
    остальные. Часть видна в консоли, часть проявится только после того,
    как карточки нарисуются.

    Что делать:
    1. Открой страницу и консоль. Выпиши, что видишь: экран, консоль,
       вкладка Elements.
    2. Найди первую причину. Запиши её до починки: что происходит,
       почему и в какой строке.
    3. Почини, перезагрузи, вернись к шагу 2. И так четыре раза.
    4. Хотя бы одну причину найди брейкпоинтом в Sources, а не чтением
       кода: остановись, посмотри Scope и Call stack.
    5. Сдай все четыре причины списком: симптом → причина → починка.

    Правила:
    - Карточки в разметку не дописывай: каталог рисуется кодом.
    - games.js и styles.css менять не надо, поломок в них нет.
    - Библиотеки не подключай.

    Готово, когда на странице шесть карточек, в консоли пусто, и слова
    «undefined» на экране нет.
  -->
</head>
<body>
  <h1>Игротека</h1>

  <ul class="catalog"></ul>

  <noscript>Каталог собирается скриптом. Без JavaScript список игр не появится.</noscript>
</body>
</html>
