<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр M03 — 5: порядок и таб</title>
  <link rel="stylesheet" href="styles.css">
  <!--
    Задание: styles.css рядом с этим файлом уже собирает нужную
    картинку и на 360px, и на 1200px. Ломать её нельзя, а вот всё
    остальное — можно.

    Что делать:
    1. Открой страницу в окне шириной 360px (DevTools → device toolbar).
    2. Кликни в адресную строку и жми Tab, пока фокусная рамка не пройдёт
       все три ссылки. Мышь не трогай.
    3. Выпиши два списка: в каком порядке ссылки обходит фокус и в каком
       порядке их читает глаз сверху вниз. Ссылки пронумерованы прямо
       в тексте — списки выписываются номерами.
    4. Ответь себе, почему списки разошлись и что из этого следует для
       того, кто ходит по странице с клавиатуры или через скринридер.
    5. Повтори на 1200px. Отметь, совпадают ли списки там.
    6. Почини так, чтобы порядок фокуса совпадал с порядком, который
       читает глаз. Картинку на 360px при этом не меняй.

    В этой ступени разметку менять МОЖНО — в отличие от остальных
    четырёх ступеней M03. Скорее всего, без этого не обойтись.

    Починку надо обосновать письменно, три-четыре предложения:
    что поменял, почему именно так и чем за это заплатил на 1200px.
    Ответ «убрал order» без объяснения не засчитывается: у этой задачи
    нет решения, которое ничего не стоит, и Ментор спросит про цену.

    Целевые размеры (уже реализованы в стартовом CSS — сверься с ними
    после починки, ничего не должно поехать):
    - box-sizing: border-box глобально; маргин body — 0;
      шрифт system-ui, sans-serif; фон #f2e9e4, текст #22223b;
    - блок промо: максимум 640px, по центру страницы,
      внутренние отступы 24px сверху/снизу и 16px по бокам;
    - заголовок: 24px до 768px, 32px от 768px, отступ снизу 8px;
    - абзац: 16px, интерлиньяж 1.5, цвет #4a4e69, отступ снизу 16px;
    - ссылки: до 768px — колонка с зазором 8px, от 768px — ряд
      с зазором 12px, ссылки в ряду равной ширины;
    - ссылка: отступы 12px 16px, фон #22223b, текст #f2e9e4,
      скругление 6px, жирная, по центру, без подчёркивания;
    - фокус: контур 3px сплошной #ffb703 с отступом 2px. Без видимого
      фокуса это задание физически не сделать — не убирай его.


    Решение: Я изменил порядок ссылок в HTML на 3–2–1 и убрал `order`, чтобы порядок в DOM,
    порядок фокуса и визуальный порядок совпадали на мобильном. Картинка на 360px при этом сохранилась,
    но цена решения — на 1200px ссылки также идут в порядке 3–2–1 вместо исходного 1–2–3.
    Сначала я рассматривал вариант сделать два одинаковых меню
    и переключать их через медиазапросы с помощью `display: none`, 
    но отказался от него, потому что это создало бы дублирование разметки 
    и обходило бы проблему с логическим порядком, которую как раз проверяет это задание.

  -->
</head>
<body>
  <main>
    <section class="promo">
      <h1>Игротека</h1>
      <p>Каталог игр, который помнит, во что ты играл, и не спрашивает
      об этом дважды. Три двери внутрь — выбирай любую.</p>
      <nav class="promo-nav" aria-label="Быстрые ссылки">
        <a href="#lists">3. Мои списки</a>
        <a href="#random">2. Случайная игра</a>
        <a href="#catalog">1. Каталог</a>
      </nav>
    </section>
  </main>
</body>
</html>
