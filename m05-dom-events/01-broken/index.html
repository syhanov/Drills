<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр M05 — сломанные обработчики</title>
  <link rel="stylesheet" href="styles.css">
  <script src="games.js" defer></script>
  <script src="app.js" defer></script>
  <!--
    Задание: на странице должны работать четыре вещи.
    1. Поле поиска фильтрует список по названию, пока ты печатаешь.
    2. Кнопка «Подробнее» показывает под названием жанры и платформы.
    3. Наведение мыши на пункт подсвечивает его рамкой.
    4. Escape очищает поле и возвращает полный список.

    Не работает ни одна. Причин ровно четыре, и они независимы: починка
    одной не чинит остальные. Две видны красной строкой в консоли, две
    молчат — их видно только по тому, что на странице ничего не
    происходит.

    Что делать:
    1. Открой страницу и консоль. Пройди все четыре сценария руками и
       выпиши, что видел: экран, консоль, вкладка Elements.
    2. Найди первую причину. Запиши её до починки: симптом, причина,
       место в коде.
    3. Почини, перезагрузи, вернись к шагу 2. И так четыре раза.
    4. Хотя бы одну причину найди отладчиком, а не чтением кода: точка
       останова в обработчике или Event Listener Breakpoints в Sources.
    5. Сдай все четыре списком: симптом → причина → починка.

    Правила:
    - Обработчики только через addEventListener. Атрибуты onclick,
      oninput и им подобные в разметке не заводи.
    - Пункты списка в разметку не дописывай: список рисуется кодом.
    - games.js и styles.css менять не надо, поломок в них нет.
    - Библиотеки не подключай.

    Готово, когда все четыре сценария работают, а консоль пуста — в том
    числе после того, как ты поводил мышью по всему списку.
  -->
</head>
<body>
  <h1>Игротека</h1>

  <div class="filter">
    <label class="filter__label" for="search">Поиск по названию</label>
    <input class="filter__input" id="search" type="text" autocomplete="off">
  </div>

  <ul class="list"></ul>

  <noscript>Список собирается скриптом. Без JavaScript игры не появятся.</noscript>
</body>
</html>
