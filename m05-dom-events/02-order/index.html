<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Тренажёр M05 — порядок событий</title>
  <link rel="stylesheet" href="styles.css">
  <script src="order.js" defer></script>
  <!--
    Задание: в order.js десять сценариев на одном стенде — три вложенных
    блока #outer > #middle > #inner и ссылка #link внутри. В каждом
    сценарии обработчики висят по-разному, а клик отправляется кодом.

    Порядок работы:
    1. Не открывая страницу, прочитай сценарий и впиши ожидаемый порядок
       в комментарий «ожидаемый порядок:» над ним. Пиши метки так, как их
       печатает консоль: `#inner → #middle → #outer`. Отдельно пиши, что
       станет с действием по умолчанию, если в сценарии есть ссылка.
    2. Заполни все десять комментариев. Только потом открывай страницу.
    3. Открой консоль и сверь построчно: номер к номеру.
    4. Каждое расхождение объясни правилом и запиши объяснение рядом со
       своим предсказанием. Само предсказание не стирай.

    Задача закрыта, когда объяснены все расхождения, а не когда все
    ответы совпали. Десять совпадений из десяти без объяснений не
    принимаются.

    Правила:
    - Разметку стенда, хелперы (on, click, report, reset) и порядок
      сценариев не меняй.
    - Кликать руками не нужно: клик отправляет click(selector).
      Поэкспериментировать руками можно после того, как все десять
      предсказаний записаны.
    - Библиотеки не подключай.

    Если строка сценария печатает «(ничего)» — ни один обработчик не
    сработал. Это допустимый ответ, и его тоже надо объяснить.
  -->
</head>
<body>
  <h1>Порядок событий</h1>
  <p class="hint">Сценарии отправляют клики сами. Результат — в консоли.</p>

  <div id="stage"></div>
</body>
</html>
