<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alt</title>
</head>
<body>
    <!--на картинке изображён график, поэтому пользователь должен знать, какая информация на нём отражена.-->
    <figure>
        <img src="img-alt/прог.-антирек.jpg" 
        alt="график на котором видно что с 2010 по 2015 год количество людей играющих в видео игры увеличилось на 160 милионов челоек">
        <figcaption>график развития индустрии видео игр</figcaption>
    </figure>

    <!--картинка‑кнопка к графику выше, поэтому пользователь должен понимать назначение ссылки.-->
    <a href="https://vawilon.ru/statistika-gejmerov/"><img src="img-alt/logo-1-1-e1521743764796.png" 
    alt="ссылка на статью к графику выше"></a>

    <!-- это декоративный элемент, который показывает внешний вид товара. Снизу уже описано, о чём будет идти речь, поэтому атрибут alt здесь не нужен.-->
    <figure>
        <img src="img-alt/dualsens.png" alt="">
        <figcaption>обзор дуалсенса</figcaption>
    </figure>

    <!--логотип является декоративным элементом, поэтому атрибут alt для него здесь не нужен.-->
    <div class="logo">
        <img src="img-alt/GameRankLogo.png" 
        alt="">
        <span>gamerank</span>
    </div>

    <!--Обоснование: это кадр из игры, атрибут alt описывает происходящее на данном кадре.-->
    <figure>
        <img src="img-alt/witch2.webp" alt="Главный герой сражается с лешим">
        <figcaption>обзор ведьмак 3</figcaption>
    </figure>
</body>
</html>
