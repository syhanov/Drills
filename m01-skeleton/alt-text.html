<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alt</title>
</head>
<body>
    <figure>
        <img src="img-alt/прог.-антирек.jpg" 
        alt="график на котором видно что с 2010 по 2015 год количество людей играющих в видео игры увеличилось на 160 милионов челоек

        Обоснование: на картинке изображён график, поэтому пользователь должен знать, какая информация на нём отражена">
        <figcaption>график развития индустрии видео игр</figcaption>
    </figure>

    <a href="https://vawilon.ru/statistika-gejmerov/"><img src="img-alt/logo-1-1-e1521743764796.png" 
    alt="ссылка на статью к графику выше

    Обоснование: картинка кнопка к графику выше, поэтому пользователь должен понимать назначение ссылки"></a>

    <figure>
        <img src="img-alt/dualsens.png" alt="
        Обоснование: это декаративный элемент который показывает внешний вид товара, снизу уже описано о чем будет идти речь поэтому alt здесь не нужен">
        <figcaption>обзор дуалсенса</figcaption>
    </figure>
    <div class="logo">
        <img src="img-alt/GameRankLogo.png" 
        alt="Обоснование: логотип являеться декоротивным элементом поэто alt для него здесь не нужен">
        <span>gamerank</span>
    </div>
    <figure>
        <img src="img-alt/witch2.webp" alt="Главный герой сражается с лешим
        
        Обоснование: это кадр из игры, alt описывает проиходящее на данном кадре">
        <figcaption>обзор ведьмак 3</figcaption>
    </figure>
</body>
</html>
